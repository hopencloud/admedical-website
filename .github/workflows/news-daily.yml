name: News Daily (자동 발행)

# 매일 새벽, 의료계 뉴스를 수집해 기사 1편을 생성하고 커밋한다.
#
# 주 1회 5편 몰아쓰기에서 매일 1편으로 바꿨다(2026-08-11). 이유 두 가지:
#   · 사흘에 11편 → 일주일 공백 같은 발행 패턴이 구글에는 대량생산 신호로 읽힌다.
#     실제로 애드센스가 '가치가 별로 없는 콘텐츠'로 반려했다.
#   · 5편을 한 번에 쓰면 넷째 편쯤부터 소재가 떨어져 반려된다. 하루 1편이면
#     지난 7일 후보 풀에서 매일 새 주제를 고를 여유가 있다.
# 맥북과 무관하게 GitHub 클라우드에서 돌기 때문에 노트북이 꺼져 있어도 발행된다.
#
# 중단 방법 3가지:
#   1) Supabase news_settings.auto_publish = false   ← /admin 킬스위치 (즉시)
#   2) GitHub → Actions → 이 워크플로우 → Disable
#   3) 이 파일의 schedule 블록 주석 처리

on:
  schedule:
    # 매일 05:30 KST = 전날 20:30 UTC.
    # 맥북의 심의 데이터 수집·통계 갱신(05:00)이 끝난 뒤에 기사를 써야
    # 기사에 인용되는 통과 건수가 최신값이 된다.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "발행할 글 수 (비워두면 /admin 의 '한 번에 발행할 수' 설정을 따름)"
        required: false
        default: ""
      force:
        description: "이미 발행한 날이어도 실행 (true/false)"
        required: false
        default: "false"
      mail_only:
        description: "기사 생성 없이 뉴스레터 발송만 (true/false)"
        required: false
        default: "false"

concurrency:
  group: news-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 기사 1편에 5~12분(원고 4~5회 LLM 호출 + 고화질 이미지 2장 + 썸네일).
    # 하루 1편이지만 반려되면 최대 3번까지 다시 시도하므로 여유를 둔다.
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한글 폰트 설치
        # 썸네일에 기사 제목을 한글로 넣는다. 폰트가 없으면 썸네일이 생성되지 않는다.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: Install dependencies
        # OCR 계열(easyocr 등)은 이 작업에 불필요하고 무거워서 최소 의존성만 설치한다.
        run: |
          python -m pip install --upgrade pip
          pip install "openai>=1.40.0" "supabase>=2.5.0" "python-dotenv>=1.0.0" \
                      "requests>=2.31.0" "Pillow>=10.0.0"

      - name: Run news pipeline
        if: github.event.inputs.mail_only != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL || 'gpt-4o' }}
          NEWS_IMAGE_MODEL: ${{ vars.NEWS_IMAGE_MODEL || 'gpt-image-2' }}
          # 하루 1편이지만 후보는 지난 7일치를 본다. 좁히면 중복 차단에 걸려
          # 고를 주제가 없어진다 (이미 다룬 기사는 파이썬이 따로 제외한다).
          NEWS_LOOKBACK_HOURS: "168"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          # count 를 비워두면 --count 를 넘기지 않는다 → 파이프라인이 Supabase
          # news_settings.daily_count (=/admin 의 '하루 발행 수') 를 쓴다.
          if [ -n "${{ github.event.inputs.count }}" ]; then ARGS="$ARGS --count ${{ github.event.inputs.count }}"; fi
          echo "실행 인자: ${ARGS:-（설정값 사용）}"
          python scripts/news_pipeline.py $ARGS

      - name: 발행 전 검증
        if: github.event.inputs.mail_only != 'true' 
        # 생성된 기사가 규칙을 깨면 커밋하지 않는다.
        # (alt 누락, 사이트맵 확장자, 통계 0건 표시, JSON-LD 깨짐 등)
        #
        # --skip-freshness: 수집이 며칠 밀린 것과 기사 품질은 별개다.
        # 맥북이 꺼져 있었다고 기사 발행까지 막으면 안 된다.
        run: python scripts/validate_site.py --skip-freshness

      - name: Commit & push
        if: github.event.inputs.mail_only != 'true'
        run: |
          git config user.name  "admedical-bot"
          git config user.email "bot@admedical.co.kr"
          git add website/news website/assets/news website/assets/data/news-index.json \
                  website/sitemap.xml website/rss.xml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 오늘은 발행하지 않았습니다."
            exit 0
          fi
          git commit -m "인사이트 자동 발행 ($(TZ=Asia/Seoul date '+%Y-%m-%d %a'))"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: 실패 원인 요약
        if: failure()
        run: |
          {
            echo "## 발행 실패"
            echo
            echo "생성된 기사 파일:"
            ls -1 website/news/*.html 2>/dev/null | grep -v index || echo "  (없음)"
            echo
            echo "검증 결과:"
            python scripts/validate_site.py --skip-freshness 2>&1 | tail -20 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 뉴스레터 발송 (월요일만 · 지난 7일치)
        # 기사는 매일 나가지만 메일은 주 1회다. 매일 보내면 구독 해지가 늘고
        # Gmail 발송 한도(대략 500통/일)에도 부담이 된다.
        # mail_only=true 로 수동 실행하면 요일과 무관하게 보낸다.
        #
        # 커밋·푸시 뒤에 보낸다. 링크가 살아있는 상태로 메일이 나가야 한다.
        # 발송 실패가 워크플로우를 죽이지 않도록 스크립트가 종료 코드 0 을 유지하고,
        # 실패 이유는 Actions 요약 화면에 남긴다.
        if: success()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" != "1" ] && \
             [ "${{ github.event.inputs.mail_only }}" != "true" ]; then
            echo "월요일이 아니라 뉴스레터는 보내지 않습니다 (기사만 발행)."
            exit 0
          fi
          python scripts/news_mailer.py --days 7

      - name: 검색엔진에 사이트맵 알리기
        # 발행에 성공했을 때만. 실패해도 워크플로우는 통과시킨다.
        if: success()
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w "빙 핑 응답: %{http_code}\n" \
            "https://www.bing.com/ping?sitemap=https%3A%2F%2Fwww.admedical.co.kr%2Fsitemap.xml" || true
