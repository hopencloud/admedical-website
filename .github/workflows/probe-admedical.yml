name: Probe admedical.org (접속 진단)

# 심의 시안 수집을 GitHub 클라우드에서 돌릴 수 있는지 판정한다.
#
# 지금은 수집을 사장님 맥북에서만 하고 있다. 이유가 "admedical.org 가 해외 IP를
# 차단한다"는 것이었는데, 실제로 그런지 확인된 적이 없다. 한국 회선에서는
# 6/6 즉시 응답하므로, 남은 변수는 GitHub 러너의 IP뿐이다.
#
# Actions → 이 워크플로우 → Run workflow 를 한 번 누르면 결과가 로그에 나온다.
# 비용 없음, 사이트에 아무 영향 없음 (조회만 한다).

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 러너 위치 확인
        continue-on-error: true
        run: |
          echo "러너 공인 IP / 지역:"
          curl -s --max-time 10 https://ipinfo.io/json || echo "(조회 실패)"

      - name: 접속 테스트
        run: |
          python - <<'PY'
          import time, urllib.request

          FORM = "https://www.admedical.org/application/approval_confirm.do"
          API  = "https://www.admedical.org/application/approval_confirm_proc.do"
          UA   = {"User-Agent": "Mozilla/5.0"}

          print("=== 1) 페이지 접속 6회 ===")
          ok = 0
          for i in range(6):
              t = time.time()
              try:
                  r = urllib.request.urlopen(urllib.request.Request(FORM, headers=UA), timeout=20)
                  print(f"  {i+1}회: HTTP {r.status}  {time.time()-t:.1f}s")
                  ok += 1
              except Exception as e:
                  print(f"  {i+1}회: 실패 {type(e).__name__}  {time.time()-t:.1f}s")
              time.sleep(1)
          print(f"  → 성공 {ok}/6")

          print("\n=== 2) 조회 API 3회 ===")
          import urllib.parse
          api_ok = 0
          for suffix in (217800, 217801, 217802):
              t = time.time()
              try:
                  data = urllib.parse.urlencode({"approval_num": str(suffix)}).encode()
                  req = urllib.request.Request(API, data=data, headers={
                      **UA, "Referer": FORM, "X-Requested-With": "XMLHttpRequest"})
                  body = urllib.request.urlopen(req, timeout=25).read().decode("utf-8", "replace")
                  print(f"  {suffix}: {time.time()-t:.1f}s  {body[:90]}")
                  api_ok += 1
              except Exception as e:
                  print(f"  {suffix}: 실패 {type(e).__name__}  {time.time()-t:.1f}s")
              time.sleep(2)
          print(f"  → 성공 {api_ok}/3")

          if ok >= 4 and api_ok >= 2:
              verdict = "✅ 클라우드에서 수집 가능 — 맥북 없이 돌릴 수 있습니다."
          elif ok >= 4:
              verdict = "⚠️ 페이지는 열리는데 조회 API 가 막힙니다 — 추가 확인 필요."
          else:
              verdict = "❌ 차단/불통 — 한국 IP 가 필요합니다."

          print("\n" + "=" * 52)
          print("판정:", verdict)
          print("=" * 52)

          # Actions 요약 화면에 그대로 띄운다
          import os
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a", encoding="utf-8") as f:
                  f.write(f"## 진단 결과\n\n### {verdict}\n\n")
                  f.write(f"- 페이지 접속: **{ok}/6** 성공\n")
                  f.write(f"- 조회 API: **{api_ok}/3** 성공\n")
          PY
